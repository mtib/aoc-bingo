# Pull requests run only on GitHub-hosted runners (this repo is public: a fork PR must never reach the self-hosted lab host).
# On push to main the self-hosted runner on the lab builds the amd64 images and pushes them to the private registry, then the NAS
# pulls them, swaps the containers, waits for healthy and drops the old images (scripts/deploy.sh). Nothing is built on the NAS.
name: Build and Deploy

on:
  pull_request: {}
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # never cancel a deploy halfway

jobs:
  check-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache-workspaces: backend

      - name: Check backend (cargo check)
        working-directory: ./backend
        run: cargo check

  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: bun install --frozen-lockfile

      - name: Build frontend (bun build)
        working-directory: ./frontend
        run: bun run build

  image:
    needs: [check-backend, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, laptop-lab, docker]
    timeout-minutes: 30
    concurrency: { group: image-aoc-bingo, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          docker build -t registry.vpn.mm/aoc-bingo-backend:latest backend
          docker build -t registry.vpn.mm/aoc-bingo-frontend:latest --build-arg VITE_BACKEND_URL=https://api.aoc.mtib.dev frontend
          docker push registry.vpn.mm/aoc-bingo-backend:latest
          docker push registry.vpn.mm/aoc-bingo-frontend:latest
          # the previous images are dangling now: drop them (the build cache stays, it makes the next build fast)
          docker image prune -f | tail -1

  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, laptop-lab, docker]
    timeout-minutes: 20
    concurrency: { group: deploy-aoc-bingo, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the NAS pulls both images from its own registry, swaps the containers, waits for healthy and drops the old images
      - run: scripts/deploy.sh
